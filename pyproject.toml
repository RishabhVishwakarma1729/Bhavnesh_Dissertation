[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrscreen"
version = "0.1.0"
description = "AI-based candidate screening and ranking framework with an HR decision-making impact study (resume ranking, fairness audit, survey analysis)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pypdf>=4.0",
    "python-docx>=1.0",
    "streamlit>=1.30",
]

[project.optional-dependencies]
# BERT-style sentence embeddings (Track A, "embeddings" model)
embeddings = ["sentence-transformers>=2.7"]
# better PDF text extraction (falls back to pypdf when missing)
pdf = ["pdfplumber>=0.10"]
dev = ["pytest>=7"]

[project.scripts]
hrscreen = "hrscreen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hrscreen = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs a model download or a long run (deselect with -m 'not slow')",
]
